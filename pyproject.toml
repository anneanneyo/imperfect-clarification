[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "imperfect-clarification"
version = "0.1.0"
description = "Analysis helpers for clarification under imperfect user replies."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
eda = [
    "ipykernel==6.31.0",
    "matplotlib==3.9.4",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "numpy==2.0.2",
    "pandas==2.3.3",
    "reportlab==4.4.3",
    "seaborn==0.13.2",
]
training = [
    "numpy>=2.0.2,<3",
    "mlx-lm>=0.30,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers>=4.51,<6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "ruff==0.14.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["imperfect_clarification", "imperfect_clarification.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# Scope new lint rules to the package and its tests.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
